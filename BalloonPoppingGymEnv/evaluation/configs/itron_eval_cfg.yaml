  fixed_launch_time: 17.0
  corridor_targets:
    83: 40
  corridor_guidance_weight: 1.0
  corridor_guidance_horizon: 3.0
  controller_kwargs:
    loop_separation: 2.0
    rate_command_margin: 0.70
    direction_rate_feedforward: 0.01
    slew_aware: false
